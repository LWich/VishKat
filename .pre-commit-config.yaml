repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy strict
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [app, tests]
      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: security
        name: Ruff security rules
        entry: ruff check --select S
        language: system
        types: [python]

