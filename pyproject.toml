[project]
name = "vyshkat"
version = "1.0.0"
description = "FastAPI service and console demo for the VyshKat kicksharing fleet"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dependency-injector>=4.48,<5",
    "fastapi>=0.118,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.37,<1",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "basedpyright>=1.31,<2",
    "coverage>=7.10,<8",
    "httpx>=0.28,<1",
    "lizard>=1.17,<2",
    "mypy>=1.18,<2",
    "mutmut>=3.3,<4",
    "pre-commit>=4.3,<5",
    "pylint>=3.3,<5",
    "pyupgrade>=3.20,<4",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "radon>=5.1,<5.2",  # wily 1.25 requires Radon 5.x.
    "ruff>=0.14,<1",
    "vulture>=2.14,<3",
    "wily>=1.25,<2",
    "xenon>=0.9,<1",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = ["RUF001"]  # Russian user-facing strings intentionally use Cyrillic.

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = "^mutants/"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = [".venv", "htmlcov", "mutants"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.mutmut]
source_paths = ["app"]
pytest_add_cli_args = ["-q", "--no-cov"]
pytest_add_cli_args_test_selection = ["tests"]
mutate_only_covered_lines = true
use_git_change_detection = false
on_dependency_change = "rerun"

